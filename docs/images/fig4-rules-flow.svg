<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a6ea5"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#98a2b3"/>
    </marker>
  </defs>
  <rect width="1000" height="800" fill="#ffffff"/>

  <!-- 输入 -->
  <rect x="30" y="16" width="940" height="86" rx="8" fill="#e8f1fb" stroke="#c7dcf0"/>
  <text x="50" y="40" font-size="12.5" font-weight="700" fill="#1f4e79">输入：每台风机 × 8 个测点，30 s 刷新一次</text>
  <text x="50" y="60" font-size="10.5" fill="#4a6d8c">数据源 db（wind_seconds_di）或 api（等价）；回看 90 s，补拉 ≤ 1200 s</text>
  <text x="50" y="78" font-size="10.5" fill="#4a6d8c">每 (设备, 测点) 维护 deque 滑窗（保留 3650 s），以最新数据点的 ts 为参考时刻</text>
  <rect x="742" y="44" width="204" height="24" rx="12" fill="#ffffff" stroke="#c7dcf0"/>
  <text x="844" y="60" font-size="10" text-anchor="middle" fill="#24527a">temp · range_1h · range_20s</text>

  <line x1="180" y1="102" x2="180" y2="128" stroke="#3a6ea5" marker-end="url(#a)"/>
  <line x1="500" y1="102" x2="500" y2="128" stroke="#3a6ea5" marker-end="url(#a)"/>
  <line x1="820" y1="102" x2="820" y2="128" stroke="#3a6ea5" marker-end="url(#a)"/>

  <!-- 规则 01 -->
  <rect x="30" y="132" width="300" height="330" rx="8" fill="#fffaf3" stroke="#f0d9a8"/>
  <text x="48" y="156" font-size="12" font-weight="700" fill="#b45309">规则 01 · 绝对值（逐点即时）</text>
  <text x="48" y="172" font-size="9.5" fill="#a16207">c01_zero → fault → high → low，首个命中生效</text>

  <rect x="42" y="182" width="164" height="34" rx="5" fill="#ffffff" stroke="#e8c78c"/>
  <text x="124" y="203" font-size="9.5" text-anchor="middle" fill="#8a5a12">|temp| ≤ 1e−6（恒 0）？</text>
  <line x1="208" y1="199" x2="224" y2="199" stroke="#d97706" marker-end="url(#o)"/>
  <rect x="228" y="186" width="90" height="26" rx="13" fill="#fdf1e3" stroke="#f0d9a8"/>
  <text x="273" y="203" font-size="9.5" text-anchor="middle" fill="#b45309">C01_ZERO</text>

  <rect x="42" y="228" width="164" height="34" rx="5" fill="#ffffff" stroke="#e8c78c"/>
  <text x="124" y="249" font-size="9.5" text-anchor="middle" fill="#8a5a12">temp ≥ 850 ℃ ？</text>
  <line x1="208" y1="245" x2="224" y2="245" stroke="#d97706" marker-end="url(#o)"/>
  <rect x="228" y="232" width="90" height="26" rx="13" fill="#fdf1e3" stroke="#f0d9a8"/>
  <text x="273" y="249" font-size="9.5" text-anchor="middle" fill="#b45309">C01_FAULT</text>

  <rect x="42" y="274" width="164" height="34" rx="5" fill="#ffffff" stroke="#e8c78c"/>
  <text x="124" y="295" font-size="9.5" text-anchor="middle" fill="#8a5a12">temp &gt; 90 / 130 ℃ ？</text>
  <line x1="208" y1="291" x2="224" y2="291" stroke="#d97706" marker-end="url(#o)"/>
  <rect x="228" y="278" width="90" height="26" rx="13" fill="#fdf1e3" stroke="#f0d9a8"/>
  <text x="273" y="295" font-size="9.5" text-anchor="middle" fill="#b45309">C01_HIGH</text>

  <rect x="42" y="320" width="164" height="34" rx="5" fill="#ffffff" stroke="#e8c78c"/>
  <text x="124" y="341" font-size="9.5" text-anchor="middle" fill="#8a5a12">temp ≤ −40 ℃ ？</text>
  <line x1="208" y1="337" x2="224" y2="337" stroke="#d97706" marker-end="url(#o)"/>
  <rect x="228" y="324" width="90" height="26" rx="13" fill="#fdf1e3" stroke="#f0d9a8"/>
  <text x="273" y="341" font-size="9.5" text-anchor="middle" fill="#b45309">C01_LOW</text>

  <text x="48" y="378" font-size="9.5" fill="#8a5a12">全部不命中 → 正常；恒 0 判为传感器故障，而非温度越限</text>
  <text x="48" y="396" font-size="9.5" fill="#a16207">轴承阈值 90 ℃，定子线圈 130 ℃；热阈值按测点组配置</text>
  <text x="48" y="414" font-size="9.5" fill="#a16207">命中即逐点判定，不等窗口；越限原始点写入 EXCEED_CSV</text>

  <!-- 规则 02 -->
  <rect x="350" y="132" width="300" height="330" rx="8" fill="#fffaf3" stroke="#f0d9a8"/>
  <text x="368" y="156" font-size="12" font-weight="700" fill="#b45309">规则 02 · 死值（1 h 窗口）</text>
  <text x="368" y="172" font-size="9.5" fill="#a16207">窗口须"够长 + 够密"，且数据新鲜</text>

  <rect x="362" y="182" width="164" height="42" rx="5" fill="#ffffff" stroke="#e8c78c"/>
  <text x="444" y="200" font-size="9.5" text-anchor="middle" fill="#8a5a12">跨度 ≥ 2700 s</text>
  <text x="444" y="216" font-size="9.5" text-anchor="middle" fill="#8a5a12">且样本 ≥ 100 ？</text>
  <line x1="528" y1="203" x2="544" y2="203" stroke="#98a2b3" marker-end="url(#g)"/>
  <rect x="548" y="190" width="90" height="26" rx="13" fill="#f2f4f7" stroke="#d8dee7"/>
  <text x="593" y="207" font-size="9.5" text-anchor="middle" fill="#7d8899">正常（否）</text>

  <rect x="362" y="238" width="164" height="42" rx="5" fill="#ffffff" stroke="#e8c78c"/>
  <text x="444" y="256" font-size="9.5" text-anchor="middle" fill="#8a5a12">max − min &lt; 1e−9 ？</text>
  <text x="444" y="272" font-size="8.5" text-anchor="middle" fill="#a16207">即窗口内读数完全相同</text>
  <line x1="528" y1="259" x2="544" y2="259" stroke="#d97706" marker-end="url(#o)"/>
  <rect x="548" y="246" width="90" height="26" rx="13" fill="#fdf1e3" stroke="#f0d9a8"/>
  <text x="593" y="263" font-size="9.5" text-anchor="middle" fill="#b45309">C02_FROZEN</text>

  <rect x="362" y="294" width="164" height="42" rx="5" fill="#eef7f0" stroke="#9ecfae"/>
  <text x="444" y="312" font-size="9.5" text-anchor="middle" fill="#1f6b3a">已激活 且 滞后 &gt; 1800 s ？</text>
  <text x="444" y="328" font-size="8.5" text-anchor="middle" fill="#1f6b3a">断采兜底，防告警永久悬挂</text>
  <line x1="528" y1="315" x2="544" y2="315" stroke="#4a9a6b" marker-end="url(#a)"/>
  <rect x="548" y="302" width="90" height="26" rx="13" fill="#dff3e4" stroke="#9ecfae"/>
  <text x="593" y="319" font-size="9.5" text-anchor="middle" fill="#1f6b3a">RECOVER</text>

  <text x="368" y="362" font-size="9.5" fill="#8a5a12">滞后 ≤ 1200 s 才参与判定；20~30 min 维持原状态</text>
  <text x="368" y="380" font-size="9.5" fill="#a16207">不产生"断采告警"，仅在已报警时显式恢复</text>
  <text x="368" y="398" font-size="9.5" fill="#a16207">窗口以最新点 ts 回溯，跨度不随延迟衰减</text>

  <!-- 规则 03 -->
  <rect x="670" y="132" width="300" height="330" rx="8" fill="#fffaf3" stroke="#f0d9a8"/>
  <text x="688" y="156" font-size="12" font-weight="700" fill="#b45309">规则 03 · 突变（20 s 窗口）</text>
  <text x="688" y="172" font-size="9.5" fill="#a16207">限定高温区间 + 持续时间，抑制毛刺</text>

  <rect x="682" y="182" width="164" height="42" rx="5" fill="#ffffff" stroke="#e8c78c"/>
  <text x="764" y="200" font-size="9.5" text-anchor="middle" fill="#8a5a12">跨度 ≥ 15 s</text>
  <text x="764" y="216" font-size="9.5" text-anchor="middle" fill="#8a5a12">且样本 ≥ 3 ？</text>
  <line x1="848" y1="203" x2="864" y2="203" stroke="#98a2b3" marker-end="url(#g)"/>
  <rect x="868" y="190" width="90" height="26" rx="13" fill="#f2f4f7" stroke="#d8dee7"/>
  <text x="913" y="207" font-size="9.5" text-anchor="middle" fill="#7d8899">正常（否）</text>

  <rect x="682" y="238" width="164" height="46" rx="5" fill="#ffffff" stroke="#e8c78c"/>
  <text x="764" y="256" font-size="9.5" text-anchor="middle" fill="#8a5a12">range_20s &gt; 20 ℃</text>
  <text x="764" y="272" font-size="9.5" text-anchor="middle" fill="#8a5a12">且 temp &gt; 90 / 100 ℃ ？</text>
  <line x1="848" y1="261" x2="864" y2="261" stroke="#d97706" marker-end="url(#o)"/>
  <rect x="868" y="248" width="90" height="26" rx="13" fill="#fdf1e3" stroke="#f0d9a8"/>
  <text x="913" y="265" font-size="9.5" text-anchor="middle" fill="#b45309">候选</text>

  <rect x="682" y="298" width="164" height="42" rx="5" fill="#ffffff" stroke="#e8c78c"/>
  <text x="764" y="316" font-size="9.5" text-anchor="middle" fill="#8a5a12">候选持续 ≥ 5 s ？</text>
  <text x="764" y="332" font-size="8.5" text-anchor="middle" fill="#a16207">按数据点 ts 计量</text>
  <line x1="848" y1="319" x2="864" y2="319" stroke="#d97706" marker-end="url(#o)"/>
  <rect x="868" y="306" width="90" height="26" rx="13" fill="#fdf1e3" stroke="#f0d9a8"/>
  <text x="913" y="323" font-size="9.5" text-anchor="middle" fill="#b45309">C03_FLUCT</text>

  <text x="688" y="366" font-size="9.5" fill="#8a5a12">条件中断即清零 streak，下一次命中重新计时</text>
  <text x="688" y="384" font-size="9.5" fill="#a16207">低温区跳变多为接线尖峰/补点，不报警</text>
  <text x="688" y="402" font-size="9.5" fill="#a16207">线圈门槛 100 ℃，轴承门槛 90 ℃</text>

  <!-- 汇入状态机 -->
  <line x1="180" y1="462" x2="180" y2="496" stroke="#3a6ea5" marker-end="url(#a)"/>
  <line x1="500" y1="462" x2="500" y2="496" stroke="#3a6ea5" marker-end="url(#a)"/>
  <line x1="820" y1="462" x2="820" y2="496" stroke="#3a6ea5" marker-end="url(#a)"/>

  <!-- 状态机 -->
  <rect x="30" y="500" width="940" height="118" rx="8" fill="#e8f1fb" stroke="#c7dcf0"/>
  <text x="50" y="524" font-size="12.5" font-weight="700" fill="#1f4e79">状态机：每个（设备 × 测点 × 规则码）一个二值状态</text>
  <rect x="50" y="536" width="440" height="66" rx="6" fill="#ffffff" stroke="#b9cfe8"/>
  <text x="68" y="557" font-size="10.5" fill="#24527a">边沿触发：False → True 输出 ALARM</text>
  <text x="68" y="574" font-size="10.5" fill="#24527a">重复命中同一状态不重复发事件</text>
  <text x="68" y="591" font-size="10.5" fill="#24527a">True → False 输出 RECOVER</text>

  <rect x="510" y="536" width="440" height="66" rx="6" fill="#ffffff" stroke="#b9cfe8"/>
  <text x="528" y="557" font-size="10.5" fill="#24527a">同类告警冷却 600 s，期内不再触发</text>
  <text x="528" y="574" font-size="10.5" fill="#24527a">恢复后可再次触发；重启回放末条事件</text>
  <text x="528" y="591" font-size="10.5" fill="#24527a">恢复活跃状态与冷却起点</text>

  <line x1="500" y1="618" x2="500" y2="646" stroke="#d97706" marker-end="url(#o)"/>

  <!-- 输出 -->
  <g>
    <rect x="30" y="650" width="222" height="86" rx="6" fill="#ffffff" stroke="#b9cfe8"/>
    <text x="48" y="672" font-size="11" font-weight="700" fill="#24527a">ALARM_CSV</text>
    <text x="48" y="690" font-size="9.5" fill="#4a6d8c">12 列追加，逐行 flush</text>
    <text x="48" y="707" font-size="9.5" fill="#4a6d8c">含 temp / r1h / r20s</text>
    <text x="48" y="724" font-size="9.5" fill="#4a6d8c">alarm_value 与规则对应</text>

    <rect x="272" y="650" width="222" height="86" rx="6" fill="#ffffff" stroke="#b9cfe8"/>
    <text x="290" y="672" font-size="11" font-weight="700" fill="#24527a">wind_alarm（PG）</text>
    <text x="290" y="690" font-size="9.5" fill="#4a6d8c">事件流水，id 即推送游标</text>
    <text x="290" y="707" font-size="9.5" fill="#4a6d8c">ts 取触发数据点时刻</text>
    <text x="290" y="724" font-size="9.5" fill="#4a6d8c">写失败仅记日志</text>

    <rect x="514" y="650" width="222" height="86" rx="6" fill="#ffffff" stroke="#b9cfe8"/>
    <text x="532" y="672" font-size="11" font-weight="700" fill="#24527a">控制台日志</text>
    <text x="532" y="690" font-size="9.5" fill="#4a6d8c">ALARM 红 / RECOVER 绿</text>
    <text x="532" y="707" font-size="9.5" fill="#4a6d8c">轮转 100 MB × 5 份</text>
    <text x="532" y="724" font-size="9.5" fill="#4a6d8c">便于现场值守观察</text>

    <rect x="756" y="650" width="214" height="86" rx="6" fill="#fdf1e3" stroke="#f0d9a8"/>
    <text x="774" y="672" font-size="11" font-weight="700" fill="#b45309">EXCEED_CSV</text>
    <text x="774" y="690" font-size="9.5" fill="#b45309">越限原始点留档</text>
    <text x="774" y="707" font-size="9.5" fill="#b45309">超 850 / 低于 −40 / 恒 0</text>
    <text x="774" y="724" font-size="9.5" fill="#b45309">供事后追溯与标定</text>
  </g>

  <text x="30" y="762" font-size="10" fill="#7d8899">报警值口径：C01 取温度 temp，C02 取 1 h 极差 range_1h，C03 取 20 s 极差 range_20s；RECOVER 的 alarm_value 为空。</text>
  <text x="30" y="780" font-size="10" fill="#7d8899">三处输出同源同事件，PG 不可用只影响入库，不阻断 CSV 与内存状态。</text>
</svg>
