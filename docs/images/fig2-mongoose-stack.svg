<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- 顶部说明 -->
  <circle cx="480" cy="16" r="4" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.2"/>
  <line x1="480" y1="20" x2="480" y2="38" stroke="#5b6b7c" stroke-width="1.2"/>
  <text x="480" y="12" font-size="12" font-weight="700" text-anchor="middle" fill="#1f4e79">Event based non-blocking API（事件驱动 · 非阻塞）</text>

  <!-- 协议行 -->
  <g font-size="12" text-anchor="middle">
    <rect x="140" y="44" width="97" height="36" rx="6" fill="#dff3e4" stroke="#9ecfae"/>
    <text x="188" y="67" fill="#1f6b3a" font-weight="700">TCP</text>
    <rect x="237" y="44" width="97" height="36" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
    <text x="285" y="67" fill="#98a2b3">UDP</text>
    <rect x="334" y="44" width="97" height="36" rx="6" fill="#dff3e4" stroke="#9ecfae"/>
    <text x="382" y="67" fill="#1f6b3a" font-weight="700">HTTP</text>
    <rect x="431" y="44" width="97" height="36" rx="6" fill="#dff3e4" stroke="#9ecfae"/>
    <text x="479" y="67" fill="#1f6b3a" font-weight="700">WebSocket</text>
    <rect x="528" y="44" width="97" height="36" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
    <text x="576" y="67" fill="#98a2b3">MQTT</text>
    <rect x="625" y="44" width="97" height="36" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
    <text x="673" y="67" fill="#98a2b3">SNTP</text>
    <rect x="722" y="44" width="98" height="36" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
    <text x="771" y="67" fill="#98a2b3">DNS</text>
  </g>

  <!-- Core -->
  <rect x="140" y="96" width="400" height="96" rx="6" fill="#e8f1fb" stroke="#c7dcf0"/>
  <text x="158" y="118" font-size="12.5" font-weight="700" fill="#1f4e79">Core</text>
  <text x="158" y="138" font-size="10.5" fill="#4a6d8c">单线程事件循环，核心不做并发保护</text>
  <text x="158" y="155" font-size="10.5" fill="#4a6d8c">mg_mgr_poll() 轮次驱动连接与定时器</text>
  <text x="158" y="172" font-size="10.5" fill="#4a6d8c">fn(c, ev, ev_data) 事件回调派发</text>
  <text x="158" y="186" font-size="9.5" fill="#7d8899">send / recv 缓冲 · MG_EV_WRITE 异步写出</text>

  <!-- 内置 TLS（未启用） -->
  <rect x="540" y="96" width="280" height="46" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
  <text x="680" y="115" font-size="11" font-weight="700" text-anchor="middle" fill="#98a2b3">内置 TLS 1.3 + 椭圆曲线</text>
  <text x="680" y="131" font-size="9.5" text-anchor="middle" fill="#b0b8c4">mbedTLS / wolfSSL 可替换（未启用）</text>

  <!-- 外部 TLS（本系统） -->
  <rect x="828" y="90" width="128" height="58" rx="6" fill="#dff3e4" stroke="#9ecfae"/>
  <text x="892" y="110" font-size="11" font-weight="700" text-anchor="middle" fill="#1f6b3a">外部 TLS 库</text>
  <text x="892" y="126" font-size="9.5" text-anchor="middle" fill="#1f6b3a">OpenSSL</text>
  <text x="892" y="140" font-size="9" text-anchor="middle" fill="#1f6b3a">（本系统）</text>
  <circle cx="824" cy="119" r="3.5" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.2"/>
  <line x1="820" y1="119" x2="824" y2="119" stroke="#5b6b7c"/>

  <!-- 内置 TCP/IP（未启用） -->
  <rect x="140" y="200" width="680" height="46" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
  <text x="480" y="220" font-size="11" font-weight="700" text-anchor="middle" fill="#98a2b3">内置 TCP/IP IPv4 / IPv6 栈</text>
  <text x="480" y="237" font-size="9.5" text-anchor="middle" fill="#b0b8c4">无操作系统时使用，本系统未启用</text>

  <!-- 外部 TCP/IP + BSD Socket（本系统） -->
  <rect x="8" y="196" width="124" height="58" rx="6" fill="#dff3e4" stroke="#9ecfae"/>
  <text x="70" y="216" font-size="11" font-weight="700" text-anchor="middle" fill="#1f6b3a">外部 TCP/IP 栈</text>
  <text x="70" y="232" font-size="9.5" text-anchor="middle" fill="#1f6b3a">BSD Socket</text>
  <text x="70" y="246" font-size="9" text-anchor="middle" fill="#1f6b3a">（本系统）</text>
  <circle cx="136" cy="225" r="3.5" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.2"/>
  <line x1="132" y1="225" x2="140" y2="225" stroke="#5b6b7c"/>

  <!-- 网络接口行 -->
  <g text-anchor="middle">
    <rect x="140" y="254" width="97" height="52" rx="6" fill="#dff3e4" stroke="#9ecfae"/>
    <text x="188" y="274" font-size="10.5" font-weight="700" fill="#1f6b3a">Winsock</text>
    <text x="188" y="291" font-size="9" fill="#1f6b3a">Windows</text>
    <rect x="237" y="254" width="97" height="52" rx="6" fill="#dff3e4" stroke="#9ecfae"/>
    <text x="285" y="274" font-size="10.5" font-weight="700" fill="#1f6b3a">socket</text>
    <text x="285" y="291" font-size="9" fill="#1f6b3a">Linux</text>
    <rect x="334" y="254" width="97" height="52" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
    <text x="382" y="277" font-size="9.5" fill="#98a2b3">lwIP / FreeRTOS</text>
    <text x="382" y="293" font-size="9" fill="#b0b8c4">未启用</text>
    <rect x="431" y="254" width="97" height="52" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
    <text x="479" y="277" font-size="9.5" fill="#98a2b3">STM32</text>
    <text x="479" y="293" font-size="9" fill="#b0b8c4">未启用</text>
    <rect x="528" y="254" width="97" height="52" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
    <text x="576" y="277" font-size="9.5" fill="#98a2b3">NXP i.MX RT</text>
    <text x="576" y="293" font-size="9" fill="#b0b8c4">未启用</text>
    <rect x="625" y="254" width="97" height="52" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
    <text x="673" y="277" font-size="9.5" fill="#98a2b3">TI TM4C</text>
    <text x="673" y="293" font-size="9" fill="#b0b8c4">未启用</text>
    <rect x="722" y="254" width="98" height="52" rx="6" fill="#f2f4f7" stroke="#d8dee7"/>
    <text x="771" y="277" font-size="9.5" fill="#98a2b3">W5500 …</text>
    <text x="771" y="293" font-size="9" fill="#b0b8c4">未启用</text>
  </g>

  <!-- 图例 -->
  <rect x="140" y="322" width="14" height="14" rx="3" fill="#dff3e4" stroke="#9ecfae"/>
  <text x="160" y="334" font-size="10.5" fill="#4a6d8c">本系统实际启用</text>
  <rect x="286" y="322" width="14" height="14" rx="3" fill="#f2f4f7" stroke="#d8dee7"/>
  <text x="306" y="334" font-size="10.5" fill="#7d8899">库内置、部署时未启用</text>

  <!-- 说明 -->
  <text x="140" y="362" font-size="10.5" fill="#4a6d8c">部署形态：Windows / Linux 服务器，Mongoose 复用操作系统 TCP/IP 栈（BSD socket）与 OpenSSL，不启用内置栈与内置 TLS。</text>
  <text x="140" y="382" font-size="10.5" fill="#4a6d8c">并发约束：核心不做并发保护，所有 mg_* 调用必须收敛于事件循环线程——对应 6.1 节「查库与广播分离」。</text>
  <text x="140" y="402" font-size="10.5" fill="#4a6d8c">协议面：HTTP 承载静态资源与 REST，WebSocket 承载 hello / snapshot / alarm 帧；TCP 为二者传输层。</text>
</svg>
